# Veröffentlicht die Seite auf GitHub Pages, sobald etwas auf main landet.
# Voraussetzung (einmalig): Settings → Pages → Source: „GitHub Actions“.
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Modelle aus dem Cache holen
        uses: actions/cache@v6
        with:
          path: .cache/models
          key: models-${{ hashFiles('scripts/models.json') }}
      - name: Seite bauen (lädt Modelle in fester Version, prüft Größe < 1 GB)
        run: node scripts/build.mjs
      - name: Schnelltests
        run: node tests/unit.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
